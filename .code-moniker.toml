default_rules = false

[rules.taxonomy]
patterns = ["dependency", "ownership", "call-flow", "hygiene"]
components = [
  "maket",
  "workspace",
  "server",
  "contracts",
  "mcp",
  "recentering@workspace",
  "snapshot@preview",
  "cursor@collections",
  "desktop",
]

[exclude]
uris = [
  "**/node_modules/**",
  "**/dist/**",
  "**/coverage/**",
  "**/public/**",
  "**/.maket/**",
  "**/.e2e-maket/**",
  "**/docs/**",
  "**/tests/**",
  "**/*.test.ts",
  "**/*.test.tsx",
  "**/*.spec.ts",
]

[aliases]
dependency_import_ref = "kind = 'imports_symbol' OR kind = 'imports_module' OR kind = 'reexports'"
workspace_source = "source ~ '**/dir:packages/dir:client/dir:src/**'"
server_source = "source ~ '**/dir:packages/dir:server/dir:src/**'"
contracts_source = "source ~ '**/dir:packages/dir:shared/dir:src/**'"
workspace_target = "target ~ '**/dir:packages/dir:client/dir:src/**'"
server_target = "target ~ '**/dir:packages/dir:server/dir:src/**'"
mcp_bridge_target = "target ~ '**/dir:packages/dir:stdio-bridge/dir:src/**'"
workspace_runtime_target = """
  target ~ '**/external_pkg:react/**'
  OR target ~ '**/external_pkg:react-dom/**'
  OR target ~ '**/external_pkg:zustand/**'
"""
server_runtime_target = """
  target ~ '**/external_pkg:express/**'
  OR target ~ '**/external_pkg:ws/**'
  OR target ~ '**/external_pkg:node*/**'
"""
maket_application_call_ref = """
  (kind = 'calls' OR kind = 'method_call')
  AND target ~ '**/dir:packages/**'
"""
mcp_tools_source = "source ~ '**/dir:packages/dir:server/dir:src/dir:tools/**'"
server_http_routes_target = "target ~ '**/dir:packages/dir:server/dir:src/dir:routes/**'"
workspace_state_source = "source ~ '**/dir:packages/dir:client/dir:src/dir:store/**'"
workspace_view_target = "target ~ '**/dir:packages/dir:client/dir:src/dir:components/**'"
server_services_source = "source ~ '**/dir:packages/dir:server/dir:src/dir:services/**'"
server_broadcast_call = """
  (kind = 'calls' OR kind = 'method_call')
  AND (
    target.name = 'broadcast'
    OR target ~ '**/method:broadcast**'
  )
"""

[[refs.where]]
id        = "contracts-workspace-server-mcp-dependency-stays-adapter-free"
severity  = "error"
rationale = "Shared contracts must remain pure data and protocol definitions. They are consumed by both client and server, so importing adapters, framework runtimes, or Node APIs collapses the boundary."
expr      = """
  $contracts_source AND $dependency_import_ref
  => NOT ($workspace_target OR $server_target OR $mcp_bridge_target OR $workspace_runtime_target OR $server_runtime_target)
"""
message   = "`packages/shared` must not import client, server, stdio-bridge, browser framework, or server runtime code."

[[refs.where]]
id        = "workspace-server-mcp-dependency-does-not-target-runtime-implementations"
severity  = "error"
rationale = "The client mirrors server state through shared WS/HTTP contracts. Direct imports from server code couple the browser bundle to server implementation details and bypass the shared boundary."
expr      = "$workspace_source AND $dependency_import_ref => NOT ($server_target OR $mcp_bridge_target)"
message   = "`packages/client` must depend on shared contracts, not server or stdio-bridge implementation code."

[[refs.where]]
id        = "server-workspace-dependency-does-not-target-workspace-runtime"
severity  = "error"
rationale = "Server services, routes, and tools may publish state through shared contracts, but they must not depend on UI components or client store implementation."
expr      = "$server_source AND $dependency_import_ref => NOT $workspace_target"
message   = "`packages/server` must not import client implementation code."

[[refs.where]]
id        = "workspace-server-dependency-does-not-cross-runtime-boundary"
severity  = "error"
rationale = "Client and server are separate adapters. The allowed compile-time contract between them is `packages/shared`; everything else should be reached through WS, HTTP, or MCP tool boundaries."
expr      = """
  ($workspace_source OR $server_source) AND $dependency_import_ref
  => NOT (($workspace_source AND $server_target) OR ($server_source AND $workspace_target))
"""
message   = "Client/server compile-time crossings must go through `packages/shared`."

[[refs.where]]
id        = "mcp-server-dependency-does-not-import-http-routes"
severity  = "error"
rationale = "Tools resolve services via DI; importing routes couples MCP actions to HTTP mount order."
expr      = "$mcp_tools_source AND $dependency_import_ref => NOT $server_http_routes_target"
message   = "`packages/server/src/tools` must not import routes; depend on services via DI instead."

[[refs.where]]
id        = "workspace-dependency-keeps-state-independent-from-views"
severity  = "error"
rationale = "Components subscribe to the store; the store must not depend on UI modules."
expr      = "$workspace_state_source AND $dependency_import_ref => NOT $workspace_view_target"
message   = "`packages/client/src/store` must not import UI components."

[[refs.where]]
id        = "server-ownership-keeps-websocket-broadcast-out-of-services"
severity  = "error"
rationale = "Services emit on the bus; WS fan-out lives in index.ts listeners only."
expr      = "NOT ($server_services_source AND $server_broadcast_call)"
message   = "Domain services must not call `wsRegistry.broadcast`; emit on the bus and let index.ts listeners fan out."

[[shape.callable.where]]
id        = "maket-hygiene-limits-callable-size"
severity  = "error"
rationale = "Large functions make changes harder to review safely and usually hide multiple responsibilities. Extract named steps, move behavior to the right collaborator, or add a local code-moniker ignore with the design reason."
expr      = "lines <= 140"
message   = "Long callable: `{name}` spans more than 140 lines."

[[shape.callable.where]]
id        = "maket-hygiene-limits-parameter-count"
severity  = "error"
rationale = "Long parameter lists make call sites brittle and often indicate a missing options object or domain value."
expr      = "count(param) <= 7"
message   = "Long parameter list: `{name}` has more than 7 parameters."

[[shape.callable.where]]
id        = "maket-ownership-keeps-behavior-with-its-owner"
severity  = "error"
rationale = """
Feature envy is behavior that mostly talks to another application owner and
should move there. Runtime/framework calls are ignored.

Only an explicit naming contract is exempt in-rule: `dispatch*` switchboards
route by message type and are allowed high fan-out. Every other intentional
port (MCP tool, HTTP handler, UI shell, multi-service factory method) must
either restructure so the logic lives with its owner, or carry a module-level
`// code-moniker: ignore[maket-ownership-keeps-behavior-with-its-owner]` with a design reason.
Do not widen this predicate with package-wide moniker path globs.
"""
expr      = """
  name =~ ^dispatch
  OR count(out_refs, $maket_application_call_ref AND source.parent != target.parent) < 8
  OR count(out_refs, $maket_application_call_ref AND source.parent != target.parent)
     <= count(out_refs, $maket_application_call_ref AND source.parent = target.parent)
"""
message   = "Feature envy candidate: `{name}` calls external owners more than local ones."

[[shape.annotation.where]]
id        = "maket-hygiene-keeps-comments-out-of-callables"
severity  = "error"
rationale = "Comments inside functions tend to narrate implementation steps that should be expressed through names, extraction, or clearer structure."
expr      = "parent.shape != 'callable'"
message   = "Comment inside callable: remove the narrative comment or extract a named step."

[[shape.type.where]]
id        = "maket-hygiene-limits-type-size"
severity  = "error"
rationale = "Large types concentrate responsibility. In Maket this is a review prompt for services, UI components, and contracts that may need splitting."
expr      = "count(shape:callable) <= 35 AND count(shape:value) <= 40"
message   = "Large type: `{name}` has many direct callables or values."

[[shape.type.where]]
id        = "maket-hygiene-keeps-method-sizes-coherent"
severity  = "error"
rationale = "A type with one or two dominant methods is often hiding a workflow that wants named steps."
expr      = "count(shape:callable) >= 6 => cv(shape:callable, lines) <= 1.1"
message   = "Method-size disharmony: `{name}` has an uneven method-size distribution."

[[shape.type.where]]
id        = "maket-hygiene-keeps-callable-names-unique"
severity  = "error"
rationale = "Duplicate callable names inside one type make moniker queries and reviews harder to reason about."
expr      = "size(unique(shape:callable.name)) = size(shape:callable.name)"
message   = "Duplicate callable names under `{name}`."
