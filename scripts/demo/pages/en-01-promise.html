<div data-id="page" style="width:297mm;height:210mm;background:var(--charte-color-bg);display:grid;grid-template-columns:3fr 2fr;font-family:var(--charte-font-body);color:var(--charte-color-text);">

    <div data-id="bottom">

        <span data-id="dot-3" style="width:16mm;height:1mm;background:var(--charte-color-muted);opacity:0.4;border-radius:0.5mm;"></span>

</div>
