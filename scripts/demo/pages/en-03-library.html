<div data-id="page" style="width:297mm;height:210mm;background:var(--charte-color-bg);padding:var(--charte-spacing-page);display:grid;grid-template-columns:1fr 1.4fr;gap:var(--charte-spacing-section);font-family:var(--charte-font-body);color:var(--charte-color-text);">
  <div data-id="left" style="display:flex;flex-direction:column;justify-content:space-between;">
    <div data-id="top">
      <div data-id="step" style="font-size:var(--charte-text-kicker);font-weight:600;letter-spacing:0.6mm;text-transform:uppercase;color:var(--charte-color-accent)">Step 02 · Your library</div>
    </div>
    <div data-id="middle">
      <h1 data-id="title" style="font-family:var(--charte-font-heading);font-size:var(--charte-text-title);line-height:1;font-weight:300;color:var(--charte-color-primary);margin:0;letter-spacing:-0.3mm">Images tagged<span style="color:var(--charte-color-accent);">,</span><br>reusable.</h1>
      <p data-id="lede" style="font-size:var(--charte-text-lede);line-height:1.5;color:var(--charte-color-ink-soft);margin:7mm 0 0 0;max-width:120mm">Import, tag, categorise. The agent searches by tag, not by filename. Every doc pulls from the same collection.</p>
      <div data-id="footnote" style="font-size:var(--charte-text-label);color:var(--charte-color-muted);font-style:italic;margin-top:10mm">4 assets · category <span style="color:var(--charte-color-accent);font-style:normal;font-weight:600;">generative</span> · all vector SVG.</div>
    </div>
    <div data-id="bottom">
      <div data-id="pagenum" style="font-size:var(--charte-text-meta);color:var(--charte-color-muted);letter-spacing:0.3mm">03 / 07</div>
    </div>
  </div>
  <div data-id="right" style="display:grid;grid-template-columns:repeat(2, 1fr);gap:5mm;">
    <figure data-id="card-1" style="margin:0;display:flex;flex-direction:column;gap:2.5mm;">
      <img data-id="img-1" src="/assets/fractal-triangle.svg" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:2mm;box-shadow:var(--charte-shadow-card);">
      <figcaption data-id="cap-1" style="display:flex;justify-content:space-between;align-items:baseline;font-size:2.8mm;color:var(--charte-color-ink-soft);">
        <span data-id="cap-1-name" style="font-weight:600;font-size:var(--charte-text-label)">fractal-triangle.svg</span>
        <span data-id="cap-1-tags" style="color:var(--charte-color-muted);font-size:var(--charte-text-label)">#fractal #geometric</span>
      </figcaption>
    </figure>
    <figure data-id="card-2" style="margin:0;display:flex;flex-direction:column;gap:2.5mm;">
      <img data-id="img-2" src="/assets/fractal-branches.svg" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:2mm;box-shadow:var(--charte-shadow-card);">
      <figcaption data-id="cap-2" style="display:flex;justify-content:space-between;align-items:baseline;font-size:2.8mm;color:var(--charte-color-ink-soft);">
        <span data-id="cap-2-name" style="font-weight:600;font-size:var(--charte-text-label)">fractal-branches.svg</span>
        <span data-id="cap-2-tags" style="color:var(--charte-color-muted);font-size:var(--charte-text-label)">#fractal #organic</span>
      </figcaption>
    </figure>
    <figure data-id="card-3" style="margin:0;display:flex;flex-direction:column;gap:2.5mm;">
      <img data-id="img-3" src="/assets/fractal-circles.svg" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:2mm;box-shadow:var(--charte-shadow-card);">
      <figcaption data-id="cap-3" style="display:flex;justify-content:space-between;align-items:baseline;font-size:2.8mm;color:var(--charte-color-ink-soft);">
        <span data-id="cap-3-name" style="font-weight:600;font-size:var(--charte-text-label)">fractal-circles.svg</span>
        <span data-id="cap-3-tags" style="color:var(--charte-color-muted);font-size:var(--charte-text-label)">#fractal #packing</span>
      </figcaption>
    </figure>
    <figure data-id="card-4" style="margin:0;display:flex;flex-direction:column;gap:2.5mm;">
      <img data-id="img-4" src="/assets/fractal-squares.svg" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:2mm;box-shadow:var(--charte-shadow-card);">
      <figcaption data-id="cap-4" style="display:flex;justify-content:space-between;align-items:baseline;font-size:2.8mm;color:var(--charte-color-ink-soft);">
        <span data-id="cap-4-name" style="font-weight:600;font-size:var(--charte-text-label)">fractal-squares.svg</span>
        <span data-id="cap-4-tags" style="color:var(--charte-color-muted);font-size:var(--charte-text-label)">#fractal #grid</span>
      </figcaption>
    </figure>
  </div>
</div>
