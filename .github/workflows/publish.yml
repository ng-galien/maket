name: Publish npm, MCP Registry, and GitHub Release

# Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret required.
# One-time setup on npmjs.com: Settings → Trusted Publishers → add a pending
# publisher for @ng-galien/maket bound to repo ng-galien/maket, workflow
# filename "publish.yml", and (optional) environment "release".

on:
  push:
    tags:
      - "v*" # e.g. v1.0.1, v1.1.0, v2.0.0
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @ng-galien/maket and create release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    # `id-token: write` is what lets GitHub mint the short-lived OIDC token
    # that npm verifies against the trusted publisher config. Without it,
    # `npm publish` falls back to token auth and fails.
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Validate trigger
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Manual registry catch-up must run from main."
              exit 1
            fi
          elif [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "::error::Release publication must run from an existing v* tag."
            exit 1
          fi

      - name: Resolve and validate package version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v${VERSION}" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version ${VERSION}"
            exit 1
          fi
          npm run version:check

      # Trusted publishing requires npm CLI >= 11.5.1. Pin the current npm
      # release so publication and install-script policy stay reproducible.
      # `--force` avoids the self-modification
      # corruption (`Cannot find module 'promise-retry'`) that bites
      # `npm install -g npm@latest` on stock runners.
      - name: Ensure npm >= 11.5.1
        run: |
          npm install -g --force npm@12.0.2
          npm --version

      - name: Check npm publication
        id: npm
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ERROR_FILE="$(mktemp)"
          if npm view "@ng-galien/maket@${VERSION}" version >/dev/null 2>"$ERROR_FILE"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "@ng-galien/maket@${VERSION} is already published; skipping npm publish."
          elif grep -q "E404" "$ERROR_FILE"; then
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              echo "::error::Manual registry catch-up requires @ng-galien/maket@${VERSION} to exist on npm."
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            cat "$ERROR_FILE" >&2
            exit 1
          fi

      - name: Install dependencies
        if: steps.npm.outputs.publish == 'true'
        run: npm install --no-audit

      - name: Stage & verify installable package
        if: steps.npm.outputs.publish == 'true'
        run: npm run test:package

      - name: Publish
        if: steps.npm.outputs.publish == 'true'
        working-directory: dist/npm
        env:
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi

      - name: Verify published MCP package identity
        id: mcp_package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MCP_NAME="$(node -p "require('./server.json').name")"
          PACKAGE_NAME="$(node -p "require('./server.json').packages.find(({ registryType }) => registryType === 'npm')?.identifier ?? ''")"
          if [[ -z "$PACKAGE_NAME" ]]; then
            echo "::error::server.json does not declare an npm package."
            exit 1
          fi

          ERROR_FILE="$(mktemp)"
          trap 'rm -f "$ERROR_FILE"' EXIT
          for attempt in {1..12}; do
            if PUBLISHED_METADATA="$(npm view "${PACKAGE_NAME}@${VERSION}" version mcpName --json --prefer-online 2>"$ERROR_FILE")"; then
              break
            fi
            if ! grep -q "E404" "$ERROR_FILE"; then
              cat "$ERROR_FILE" >&2
              exit 1
            fi
            if [[ "$attempt" -eq 12 ]]; then
              cat "$ERROR_FILE" >&2
              echo "::error::${PACKAGE_NAME}@${VERSION} is still not visible from npm after ${attempt} attempts."
              exit 1
            fi
            echo "::notice::${PACKAGE_NAME}@${VERSION} is not visible from npm yet; retrying in 5 seconds (${attempt}/12)."
            sleep 5
          done

          PUBLISHED_METADATA="$(node -p "const data = JSON.parse(process.argv[1]); JSON.stringify(Array.isArray(data) ? (data[0] ?? {}) : data)" "$PUBLISHED_METADATA")"
          PUBLISHED_VERSION="$(node -p "JSON.parse(process.argv[1]).version ?? ''" "$PUBLISHED_METADATA")"
          PUBLISHED_MCP_NAME="$(node -p "JSON.parse(process.argv[1]).mcpName ?? ''" "$PUBLISHED_METADATA")"
          if [[ "$PUBLISHED_VERSION" != "$VERSION" ]]; then
            echo "::error::Published npm version ${PUBLISHED_VERSION} does not match ${VERSION}."
            exit 1
          fi
          if [[ "$PUBLISHED_MCP_NAME" != "$MCP_NAME" ]]; then
            echo "::error::Published npm mcpName ${PUBLISHED_MCP_NAME} does not match ${MCP_NAME}."
            exit 1
          fi

          ENCODED_MCP_NAME="$(node -p "encodeURIComponent(process.argv[1])" "$MCP_NAME")"
          echo "name=${MCP_NAME}" >> "$GITHUB_OUTPUT"
          echo "encoded_name=${ENCODED_MCP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Check MCP Registry publication
        id: mcp
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ENCODED_MCP_NAME: ${{ steps.mcp_package.outputs.encoded_name }}
        run: |
          RESPONSE_FILE="$(mktemp)"
          REGISTRY_URL="https://registry.modelcontextprotocol.io/v0.1/servers/${ENCODED_MCP_NAME}/versions/${VERSION}"
          STATUS="$(curl --silent --show-error --output "$RESPONSE_FILE" --write-out "%{http_code}" "$REGISTRY_URL")"
          if [[ "$STATUS" == "200" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "MCP Registry version ${VERSION} already exists; skipping publication."
          elif [[ "$STATUS" == "404" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            cat "$RESPONSE_FILE" >&2
            echo "::error::MCP Registry lookup failed with HTTP ${STATUS}."
            exit 1
          fi

      - name: Install mcp-publisher v1.8.1
        if: steps.mcp.outputs.publish == 'true'
        run: |
          curl --fail --location --silent --show-error \
            --output mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Validate MCP Registry metadata
        if: steps.mcp.outputs.publish == 'true'
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry
        if: steps.mcp.outputs.publish == 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: steps.mcp.outputs.publish == 'true'
        run: ./mcp-publisher publish

      - name: Verify MCP Registry publication
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MCP_NAME: ${{ steps.mcp_package.outputs.name }}
          ENCODED_MCP_NAME: ${{ steps.mcp_package.outputs.encoded_name }}
        run: |
          REGISTRY_URL="https://registry.modelcontextprotocol.io/v0.1/servers/${ENCODED_MCP_NAME}/versions/${VERSION}"
          curl --fail --silent --show-error "$REGISTRY_URL" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const published = JSON.parse(input).server;
              if (published?.name !== process.env.MCP_NAME || published?.version !== process.env.VERSION) {
                console.error(`Registry returned ${published?.name}@${published?.version}; expected ${process.env.MCP_NAME}@${process.env.VERSION}.`);
                process.exit(1);
              }
            });
          '

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
              gh release edit "$GITHUB_REF_NAME" --prerelease
            else
              gh release edit "$GITHUB_REF_NAME" --prerelease=false
            fi
            echo "GitHub Release $GITHUB_REF_NAME already exists; its channel classification is aligned."
            exit 0
          fi
          node scripts/release-notes.mjs "$VERSION" > release-notes.md
          printf "\nFull changelog: https://github.com/%s/blob/%s/CHANGELOG.md\n" \
            "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> release-notes.md
          RELEASE_ARGS=(
            "$GITHUB_REF_NAME"
            --verify-tag
            --title "$GITHUB_REF_NAME"
            --notes-file release-notes.md
          )
          if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
            RELEASE_ARGS+=(--prerelease)
          fi
          gh release create "${RELEASE_ARGS[@]}"

  desktop-build:
    name: Build Maket App (${{ matrix.label }})
    if: github.ref_type == 'tag'
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            label: macOS Intel
            arch: x64
            artifact: macos-x64
          - os: macos-15
            label: macOS Apple Silicon
            arch: arm64
            artifact: macos-arm64
          - os: windows-2025
            label: Windows x64
            arch: x64
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      MAKET_SIGN_DESKTOP: "1"
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".desktop-node-version"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/maket-app.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/maket-app.keychain-db"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p runner "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p runner "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k runner "$KEYCHAIN_PATH"

      - name: Prepare Windows signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "maket-app.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          "WINDOWS_CERTIFICATE_FILE=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify desktop Node runtime
        run: npm run desktop -- check

      - name: Make installers
        run: npm run desktop -- make --arch=${{ matrix.arch }}

      - name: Collect distributables
        shell: bash
        run: |
          mkdir -p desktop-artifacts
          find packages/desktop/out/make -type f -exec cp {} desktop-artifacts/ \;

      - uses: actions/upload-artifact@v6
        with:
          name: maket-app-${{ matrix.artifact }}
          path: desktop-artifacts/*
          if-no-files-found: error

  desktop-upload:
    name: Attach Maket App installers
    if: github.ref_type == 'tag'
    needs: desktop-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: maket-app-*
          path: desktop-artifacts
          merge-multiple: true

      - name: Upload installers to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" desktop-artifacts/* --repo "$GITHUB_REPOSITORY" --clobber

  candidate-feed:
    name: Deploy candidate update feed
    if: github.ref_type == 'tag' && needs.publish.outputs.prerelease == 'true'
    needs: [publish, desktop-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Download desktop distributables
        uses: actions/download-artifact@v7
        with:
          pattern: maket-app-*
          path: desktop-artifacts

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Build Pages artifact
        run: npm run build:pages

      - name: Prepare candidate update feed
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: npx tsx scripts/prepare-candidate-update-feed.ts desktop-artifacts docs/updates/candidate "$VERSION"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

      - name: Deploy candidate feed
        id: deployment
        uses: actions/deploy-pages@v5
        env:
          NODE_OPTIONS: --disable-warning=DEP0040
