name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "packages/client/**"
      - "packages/shared/**"
      - "scripts/make-starter-bundles.ts"
      - "scripts/sync-pages.mjs"
      - "starters/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published stable release whose update feeds should be restored (vX.Y.Z)"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release feed restoration
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" || ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Restore feeds from main with a stable vX.Y.Z release tag."
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease | jq -e '.isDraft == false and .isPrerelease == false'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm install --no-audit --loglevel=error

      - name: Build Pages artifact
        run: npm run build:pages

      - name: Preserve automatic desktop update feeds
        run: npx tsx scripts/prepare-desktop-update-feeds.ts preserve docs/updates

      - name: Preserve candidate update feed
        run: npx tsx scripts/preserve-candidate-update-feed.ts docs/updates/candidate

      - name: Restore feeds from published release assets
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --dir desktop-artifacts \
            --pattern 'Maket-darwin-*.zip' --pattern 'sparkle-*.json' \
            --pattern 'Maket-Linux-x64.deb' --pattern 'Maket-Linux-x64.rpm'
          npx tsx scripts/prepare-desktop-update-feeds.ts prepare \
            docs/updates desktop-artifacts "${RELEASE_TAG#v}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        env:
          # deploy-pages v5 still pulls a deprecated built-in through its
          # current dependency tree. Keep suppression scoped to that action.
          NODE_OPTIONS: --disable-warning=DEP0040
