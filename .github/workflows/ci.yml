name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        # `npm install` instead of `npm ci` so transitive dep ranges that
        # accept a newer esbuild (^0.27 || ^0.28) don't fail strict lockfile
        # checks when the registry resolves to the newer version.
        run: npm install --no-audit

      - name: Lint & Format (Biome)
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

      - name: Build client
        run: npm run build:client
