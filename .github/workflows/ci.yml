name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CODE_MONIKER_VERSION: "0.8.0"
      CODE_MONIKER_SHA256: "325e411ca8cb7b625367e60c48b2b8af87dafa9878e99510b0da0db80a77173f"
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        # `npm install` instead of `npm ci` so transitive dep ranges that
        # accept a newer esbuild (^0.27 || ^0.28) don't fail strict lockfile
        # checks when the registry resolves to the newer version.
        run: npm install --no-audit --loglevel=error

      - name: Install Code Moniker
        shell: bash
        run: |
          archive="$RUNNER_TEMP/code-moniker.tar.xz"
          bin_dir="$RUNNER_TEMP/code-moniker-bin"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/ng-galien/code-moniker/releases/download/v${CODE_MONIKER_VERSION}/code-moniker-x86_64-unknown-linux-musl.tar.xz"
          echo "$CODE_MONIKER_SHA256  $archive" | sha256sum --check -
          mkdir -p "$bin_dir"
          tar --extract --xz --file "$archive" --directory "$bin_dir" \
            --strip-components=1
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/code-moniker" --version

      - name: Quality and coverage
        run: npm run quality

      - name: Build client
        run: npm run build:client

      - name: Build GitHub Pages demo
        run: npm run build:pages

      - name: Generate coverage badge and summary
        run: npm run coverage:badge

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error

  e2e:
    name: End-to-end (Chromium)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm install --no-audit --loglevel=error

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install PDF rasterizer
        run: sudo apt-get install --yes poppler-utils

      - name: Run browser workflows
        run: npm run test:e2e:coverage

      - name: Upload client E2E coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-client-coverage
          path: coverage/e2e/client/
          if-no-files-found: error
          retention-days: 7

      - name: Upload server E2E coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-server-coverage
          path: coverage/e2e/server/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            packages/client/playwright-report/
            packages/client/test-results/
          if-no-files-found: ignore
          retention-days: 7
