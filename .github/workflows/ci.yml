name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        # `npm install` instead of `npm ci` so transitive dep ranges that
        # accept a newer esbuild (^0.27 || ^0.28) don't fail strict lockfile
        # checks when the registry resolves to the newer version.
        run: npm install --no-audit

      - name: Lint & Format (Biome)
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

      - name: Build client
        run: npm run build:client

      - name: Test with coverage
        run: npm run test:coverage

      - name: Generate coverage badge and summary
        run: npm run coverage:badge

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error

      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- .github/badges/coverage.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage.json
          git commit -m "chore(ci): update coverage badge [skip ci]"
          git push
